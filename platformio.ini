[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
    ; If using an SPI TFT instead of a 16x2/20x4 I2C LCD, swap this for
    ; a display-specific library (e.g. TFT_eSPI) and update DisplayManager.
